; BSREM-II algorithm configuration (Ahn & Fessler 2003)
; Auto-loaded when -opti bsrem

[Algorithm]
name       = BSREM
iterations = 50:5

[Regularization]
type    = RDP
beta    = 0.3
delta   = 0.01

[BSREM]
alpha0            = 1.0       ; initial step size
gamma             = 0.05      ; decay factor
curv_denom        = false     ; curvature denominator D = S + beta*D_reg
curv_freeze       = true      ; freeze curvature after warmup
curv_warmup_iters = 2
curv_eps          = 1e-6
kappa_map         = true      ; spatially-varying beta_j = beta * kappa_j
kappa_eps         = 1e-6
kappa_clip        = 0.1,10.0  ; kappa clip range
soft_mask         = false     ; soft-mask penalty boosting
soft_mask_lambda  = 100.0     ; outside penalty boost

