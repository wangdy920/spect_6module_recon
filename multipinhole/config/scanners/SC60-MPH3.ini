[Scanner]
name = SC60-MPH3

; Paths are relative to SPECT_recon.exe; each points directly to metadata.bin + chunks.
; SC60 deploys the CSRQ derivative (18.3 GiB) of the 62.5 GiB CSRB matrix; it is
; streamed from host memory on 16 GB GPUs. To fall back to the canonical matrix, set
; chunk_format = csrb and sysmat_high = matrix/Tc99m/matrix_3module_18pin_YSO_90x90x240_141keV.
[Tc99m]
input_mode = single
chunk_format = csrq
sysmat_high = matrix/Tc99m/matrix_3module_18pin_YSO_90x90x240_141keV_CSRQ
sysmat_low =
