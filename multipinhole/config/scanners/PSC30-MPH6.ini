[Scanner]
name = PSC30-MPH6

; Paths are relative to SPECT_recon.exe; each points directly to metadata.bin + chunks.
; Native channel order remains high then low. Empty unused slots are not loaded.
[Tc99m]
input_mode = single
chunk_format = csrb
sysmat_high = matrix/Tc99m/matrix_PSC_PIN26x28x25_SCALE2_141keV_120x120x220
sysmat_low =

[Lu177]
input_mode = prefer_split
chunk_format = csrb
sysmat_high = matrix/Lu177/matrix_PSC_PIN26x28x20_208keV_120x120x220_ZFOLD
sysmat_low = matrix/Lu177/matrix_PSC_PIN26x28x20_113keV_120x120x220
