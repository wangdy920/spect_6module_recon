; HISTORICAL joint-window algorithm snapshot. It requires a scanner INI that
; declares input_mode=joint/prefer_split and both sysmat slots; device geometry
; and output policy belong to spect_config.ini.
; Historical reproduction only; not an active deployment profile.
; Practical Lu177 mouse preset for the tested 113+208 keV joint model.
; Load explicitly with -opti bsrem -algoConf <this file> and both matrices.
; Joint N10 recipe verified in the 2026-09-13 experiment; requires a joint-capable CUDA build.
; Original window order and weights: 208/113 keV, 0.1036,0.0617.
; Evidence and scope: reports/2026-09-13-subset-release.md.
; Qualitative SPECT preset, not an activity calibration or universal optimum.

[Algorithm]
name = BSREM
iterations = 30:10
save_interval = 0

[Regularization]
type = RDP
beta = 0.03
gamma = 0.0             ; RDP edge parameter, distinct from step decay below
delta = 0.01

[BSREM]
alpha0 = 1.0
gamma = 0.05           ; step decay per full iteration
curv_denom = false
kappa_map = true
kappa_eps = 1e-6
kappa_clip = 0.1,10.0
sens_floor_rel = 0.0
soft_mask = false

[Acquisition]
isotope = Lu177
projection_model = joint

[SystemMatrix]
; Channel order is 208 keV, then 113 keV. Weights apply once in the forward model.
energy_window_weights = 0.1036,0.0617
