; SC60 simulated Tc99m, single-bed compatibility recipe. Matrix grid: 90x90x240.
; Historical: SC60 now uses the shared profiles with scanners/SC60-MPH3.ini and the SC60
; device spect_config.ini. Blank values no longer clear global keys, so pair this recipe
; with a global config that has no bad_detector_file (PSC mask) when re-running it.
[Algorithm]
name = MLEM
iterations = 1000:10
save_interval = 50

[Acquisition]
isotope = Tc99m
projection_model = single

[SystemMatrix]
matrix_id = matrix_3module_18pin_YSO_90x90x240_141keV

[Detector]
channels = 96,96
angles = 360
bad_detector_file =

[PSF]
mode = sieve
kernel = castor
fwhm = 1.5
z_blur = true
min_sigmas = 3.0

[Mask]
use_cylinder = true
cylinder_dims = 36.0,96.0

[InputOutput]
matrix_grid_output = true
merge_time_segments = false
output_filters_overwrite_primary = false

[MultiBed]
; Unknown for the system under assembly; multi-bed runs must override explicitly.
bed_step_mm = 0
single_bed_step_aligned = false
z_bed_flip = 0
z_out_flip = 0
x_out_flip = 0
crop_end = 0,0
detz_edge_censor = 0
detz_row_weights_file =
normalization_factor_file =

[Normalization]
factor_file =

[Regularization]
type = None
beta = 0

[Filtering]
butterworth_cutoff = 0
gaussian_sigma = 0
smooth_apply_stage = none
butter_apply_stage = none
