; Deployment defaults. One selected recipe overlays this file; -algoConf replaces the default recipe.
; false: CLI > recipe > global. true: recipe > global > CLI for configured reconstruction keys.
; A blank value (key =) means not configured at every layer: it inherits the lower layer/default and never masks the CLI.
; Runtime input/output/device/log arguments remain caller-owned. Relative matrix/norm/cache paths use the EXE directory.

[Reconstruction]
default_config = profiles/standard_Tc99m_OSEM.conf
default_config_Tc99m = profiles/standard_Tc99m_OSEM.conf
default_config_Lu177 = profiles/standard_Lu177_OSEM.conf

[Compatibility]
; Normal CLI > algorithm config > global config priority, including RDP/TV.
; true protects the merged recipe/global reconstruction keys from CLI changes.
recon_sections_override_cli = false

; ═══════════════════════════════════════════════
;  Geometry & Hardware
; ═══════════════════════════════════════════════

[Basic]
dimensions = 120,120,220       ; canonical v4 reconstruction grid Nx,Ny,Nz
voxel_size = 0.3,0.3,0.3      ; canonical voxel size (mm)
threads    = 16                ; OpenMP threads
verbosity  = 0                 ; 0=progress/completion/warnings/errors (Info in .log) 1=Info 2=Debug; -vb overrides

[Detector]
channels = 48,48               ; detector Nz,Nx
angles   = 360                 ; projection angles
bad_detector_file = bad_dector ; prototype parity mask: detector 68

; ═══════════════════════════════════════════════
;  System Matrix & Normalization
; ═══════════════════════════════════════════════

[SystemMatrix]
root = matrix
scanner_config = scanners/PSC30-MPH6.ini
; Resolve selected recipe matrix_id/matrix_id2 uniquely under root/id or root/isotope/id.
; Explicit CLI matrix/cache paths obey recon_sections_override_cli.
compact_denom_cache_dir = cache/compact_denom ; v6 path/stat auto_<manifest-hash>.mhd, relative to SPECT_recon.exe

[Normalization]
; Installation calibration c per isotope (1/c enters the sensitivity); only this file may bind it.
; EXE-relative path, empty = uncalibrated. An explicit -normFactorFile replaces it; factor_file2_Lu177 is joint-only.
factor_file_Tc99m =
factor_file_Lu177 =

; ═══════════════════════════════════════════════
;  I/O
; ═══════════════════════════════════════════════

[InputOutput]
merge_time_segments = false  ; true: sum matching BedN across sibling YYYYMMDD_HHMMSS/SPECT directories in memory
output_filters_overwrite_primary = false ; true: unsuffixed output applies enabled output stages in Smooth->Butter order
output_dir  = output
output_name = recon

; ═══════════════════════════════════════════════
;  PSF
; ═══════════════════════════════════════════════

[PSF]
mode = sieve                   ; none | operator | sieve (CASToR sieve: operator in-loop + PSF-blurred save copies)
kernel = castor                ; adjoint | castor (strict CASToR erf kernel + z-only boundary norm + forward-reuse backward)
fwhm = 1.3                     ; global PSF FWHM (mm)
z_blur = true                  ; true: XYZ PSF, false: XY-only PSF
min_sigmas = 3.0               ; Gaussian kernel truncation radius = N * sigma

; ═══════════════════════════════════════════════
;  CTAC
; ═══════════════════════════════════════════════

[CTAC]
auto_mu_nuclide = Tc99m        ; Tc99m, I123, In111_171, In111_245, Lu177, I131

; ═══════════════════════════════════════════════
;  Output filtering (regularization is owned by the recipes)
; ═══════════════════════════════════════════════

[Filtering]
butter_apply_stage  = output   ; none | in_recon | output
output_butter_cutoff_cpcm = 5    ; output-stage physical cutoff (cycles/cm)
output_butter_order       = 8    ; output-stage Butterworth order
output_nonnegative_clamp  = true ; false reproduces linear prototype outputs; true clamps each saved copy after filtering

; ═══════════════════════════════════════════════
;  Masking
; ═══════════════════════════════════════════════

[Mask]
use_cylinder  = true            ; default ROI: single 30x21.6 mm, multi-bed 36x66 mm; cylinder_dims overrides
; Bed-count defaults; cylinder_dims overrides both.
cylinder_dims_single = 30,21.6
cylinder_dims_multi = 36,66

; ═══════════════════════════════════════════════
;  Multi-Bed
; ═══════════════════════════════════════════════

[MultiBed]
bed_step_mm = 16.8             ; scanner mechanical bed step; stride = round(bed_step_mm / voxel_z), overlap = baseNz - stride
single_bed_step_aligned = true ; single-bed output keeps step+10 layers (66 here); false restores legacy 72
; canonical stitch: each bed keeps center step+10 layers (66 for 220-layer), stride = step (56), cosine overlap 10
z_bed_flip  = 1                ; output per-bed Z flip
z_out_flip  = 0                ; flip whole output volume after per-bed flip
x_out_flip  = 0                ; flip whole output volume on X
xy_out_rotation_deg = 0        ; after flips/crop/mask; positive +X toward +Y (CCW with +Y up)
