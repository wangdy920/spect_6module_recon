; Deployment defaults. A selected recipe overlays this file; -algoConf replaces it.
; Blank key = not configured. Input/output/runtime arguments remain caller-owned.

[Reconstruction]
default_config = profiles/standard_Tc99m_OSEM.conf
default_config_Tc99m = profiles/standard_Tc99m_OSEM.conf
default_config_Lu177 = profiles/standard_Lu177_OSEM.conf

[Compatibility]
; true: recipe/global overrides CLI for configured reconstruction fields.
recon_sections_override_cli = false

[Basic]
dimensions = 120,120,220
voxel_size = 0.3,0.3,0.3
threads = 16
verbosity = 0

[Detector]
channels = 48,48
angles = 360
bad_detector_file = bad_dector

[SystemMatrix]
root = matrix
; Development default. Device packages set their SN; universal package uses -scannerConf.
scanner_config = scanners/PSC30-MPH6.ini
compact_denom_cache_dir = cache/compact_denom

[Normalization]
; Per-isotope calibration c; empty = uncalibrated.
factor_file_Tc99m =
factor_file_Lu177 =

[InputOutput]
merge_time_segments = false
output_filters_overwrite_primary = false
output_dir = output
output_name = recon

[PSF]
mode = sieve
kernel = castor
fwhm = 1.3
z_blur = true
min_sigmas = 3.0

[CTAC]
auto_mu_nuclide = Tc99m

[Filtering]
butter_apply_stage = output
output_butter_cutoff_cpcm = 5
output_butter_order = 8
output_nonnegative_clamp = true

[Mask]
use_cylinder = true
; Bed-count defaults; cylinder_dims overrides both.
cylinder_dims_single = 30,21.6
cylinder_dims_multi = 36,66

[MultiBed]
bed_step_mm = 16.8
single_bed_step_aligned = true
z_bed_flip = 1
z_out_flip = 0
x_out_flip = 0
xy_out_rotation_deg = 0
