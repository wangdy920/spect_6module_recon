; Shared algorithm profile. Matrix resources live in scanners/<SN>.ini;
; device geometry, bed step and output flips live in spect_config.ini.
; Whole-body Lu177 mouse recipe: merged projections with the single 208 keV matrix.
; RDP strength is validated for this model, not a future weighted mixed-energy matrix.
[Algorithm]
name = BSREM
iterations = 100:10
save_interval = 0

[Regularization]
type = RDP
beta = 0.1
delta = 0.01
gamma = 0

[BSREM]
alpha0 = 1
gamma = 0.05
curv_denom = false
curv_freeze = true
curv_warmup_iters = 2
curv_eps = 1e-06
kappa_map = true
kappa_eps = 1e-06
sens_floor_rel = 0
kappa_clip = 0.1,10
soft_mask = false
soft_mask_lambda = 100
mlem_equivalence = false
diagnostics = false

[Acquisition]
isotope = Lu177
projection_model = merged
