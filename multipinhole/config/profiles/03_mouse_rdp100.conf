iterations = 100:10
save_interval = 0

[Regularization]
type = RDP
beta = 0.1
delta = 0.01
gamma = 0

[BSREM]
alpha0 = 1
gamma = 0.05
curv_denom = false
curv_freeze = true
curv_warmup_iters = 2
