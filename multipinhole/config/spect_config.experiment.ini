[CTAC]
auto_mu_nuclide = Tc99m        ; Tc99m, I123, In111_171, In111_245, Lu177, I131
; auto_mu_value = 0.0152       ; optional manual override, mm^-1

; 鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺?
;  Filtering
; 鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺?

[Filtering]
butterworth_cutoff  = 0        ; in_recon normalized cutoff (0 = disabled); CLI -butter implies butter_apply_stage=in_recon
butterworth_order   = 2        ; in_recon filter order
gaussian_sigma      = 0.0      ; in_recon Gaussian sigma in mm (0 = disabled); CLI -smooth implies smooth_apply_stage=in_recon
gaussian_kernel     = 3        ; in_recon kernel half-width (voxels)
smooth_apply_stage  = output   ; none | in_recon | output
butter_apply_stage  = output   ; none | in_recon | output
output_smooth_fwhm_mm     = 0.30 ; output-stage CASToR Gaussian FWHM (mm)
output_smooth_sigmas      = 3    ; output-stage kernel truncation = N * sigma
output_butter_cutoff_cpcm = 5    ; output-stage physical cutoff (cycles/cm)
output_butter_order       = 8    ; output-stage Butterworth order
output_nonnegative_clamp  = true ; false reproduces linear prototype outputs; true clamps each saved copy after filtering

; 鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺?
