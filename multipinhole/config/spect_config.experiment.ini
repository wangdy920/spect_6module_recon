; spect_config.ini - Global Configuration for SPECT-recon
;
; This file holds device/geometry/IO parameters shared across ALL algorithms.
; Algorithm-specific iterations and BSREM tuning are managed by
; config/algo_*.conf and auto-loaded via -opti <name>.
;
; Priority (high 鈫?low): CLI flags > algo_*.conf > this file > hardcoded defaults,
; except the protected sections enabled below.
; Use -dumpConf to inspect the merged configuration.

[Compatibility]
; Protect the validated Regularization/PSF/Filtering/Postprocess policy from
; upstream CLI fields. Geometry, algorithm, iterations and I/O still use the
; normal CLI-first priority.
recon_sections_override_cli = false

