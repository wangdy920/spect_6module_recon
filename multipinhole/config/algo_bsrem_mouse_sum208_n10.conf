; Practical Lu177 mouse preview preset for the tested sum208 CSRB model.
; Input in this comparison is merged 113+208 counts with the 208 keV matrix.
; This is NOT the joint dual-matrix model; do not transfer beta unverified.
; Load with -opti bsrem -algoConf <this file> and the tested CSRB matrix.
; Evidence and scope: reports/2026-09-13-subset-release.md.

[Algorithm]
name = BSREM
iterations = 100:10
save_interval = 0

[Regularization]
type = RDP
beta = 0.1
gamma = 0.0             ; RDP edge parameter, distinct from step decay below
delta = 0.01

[BSREM]
alpha0 = 1.0
gamma = 0.05            ; step decay per full iteration
curv_denom = false
kappa_map = true
kappa_eps = 1e-6
kappa_clip = 0.1,10.0
sens_floor_rel = 0.0
soft_mask = false
