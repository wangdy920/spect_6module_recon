; spect_config.ini - Global Configuration for SPECT-recon
;
; This file holds device/geometry/IO parameters shared across ALL algorithms.
; Algorithm-specific parameters (iterations, regularization, BSREM/ADMM tuning)
; are managed by config/algo_*.conf and auto-loaded via -opti <name>.
;
; Priority (high → low): CLI flags > algo_*.conf > this file > hardcoded defaults
; Use -dumpConf to inspect the merged configuration.

; ═══════════════════════════════════════════════
;  Geometry & Hardware
; ═══════════════════════════════════════════════

[Basic]
dimensions = 200,200,200       ; reconstruction grid Nx,Ny,Nz
voxel_size = 1.0,1.0,1.0      ; voxel size (mm)
threads    = 16                ; OpenMP threads
verbosity  = 1                 ; 0=Quiet 1=Info 2=Debug

[Detector]
channels = 40                  ; detector channels (Nz or Nz,Nx)
angles   = 360                 ; projection angles

; ═══════════════════════════════════════════════
;  System Matrix
; ═══════════════════════════════════════════════

[SystemMatrix]
prune_epsilon  = 1e-10         ; drop weights below threshold
stream_build   = false         ; streaming CSR build from disk
prune_mask     = true          ; prune columns outside mask
map_csr        = true          ; memory-map CSR on load
; Compact chunk matrix auto-discovery:
;   1) CLI -chunkCSRDir wins.
;   2) default_chunk_csr_dir below is resolved relative to the exe directory.
;   3) if empty and bin/matrix/ contains exactly one metadata.bin directory,
;      that directory is used automatically.
; matrix_layout = compact-symmetric
; default_chunk_csr_dir = matrix/260601
; Release default: 260601 compact chunk CSRB (Sym90Z). Copy test_data/6module/260601 into bin/matrix/260601 for packages.
joseph_passes  = 0             ; Joseph's ray-driven passes (0 = off)
; b_proj =                     ; background/scatter projection MAT

; ═══════════════════════════════════════════════
;  I/O
; ═══════════════════════════════════════════════

[InputOutput]
output_dir  = output
output_name = recon

; ═══════════════════════════════════════════════
;  PSF
; ═══════════════════════════════════════════════

[PSF]
mode = None                    ; None | Operator
fwhm = 1.5                     ; global PSF FWHM (mm)
z_blur = true                  ; true: XYZ PSF, false: XY-only PSF
min_sigmas = 4.0               ; Gaussian kernel truncation radius = N * sigma

; ═══════════════════════════════════════════════
;  CTAC
; ═══════════════════════════════════════════════

[CTAC]
auto_mu_nuclide = Tc99m        ; Tc99m, I123, In111_171, In111_245, Lu177, I131
; auto_mu_value = 0.0152       ; optional manual override, mm^-1

; ═══════════════════════════════════════════════
;  Filtering
; ═══════════════════════════════════════════════

[Filtering]
butterworth_cutoff  = 0.35     ; frequency cutoff (normalized)
butterworth_order   = 2        ; filter order
gaussian_sigma      = 0.0     ; Gaussian sigma in mm (0 = disabled)
gaussian_kernel     = 3        ; kernel half-width (voxels)

; ═══════════════════════════════════════════════
;  Masking
; ═══════════════════════════════════════════════

[Mask]
use_cylinder  = false
cylinder_dims = 30.0,30.0      ; diameter, height (mm)
; cylinder_center = 100,100,100 ; voxel indices (1-based), empty = auto
; att_threshold = 0.0           ; body mask from attenuation map

; ═══════════════════════════════════════════════
;  Regularization (global defaults, overridden by algo_*.conf)
; ═══════════════════════════════════════════════

[Regularization]
type    = None              ; None | TV | RDP
beta    = 0.0
epsilon = 1e-6              ; TV stability
gamma   = 0.0               ; RDP gamma
delta   = 0.01              ; TV/RDP epsilon-like parameter
; ct_image =                 ; registered CT/mu-map on the reconstruction grid
ct_sigma = 0.01             ; CT bilateral scale, in ct_image intensity units
ct_weight_floor = 0.05      ; minimum TV/RDP edge coupling, range [0,1]

; ═══════════════════════════════════════════════
;  Multi-Bed
; ═══════════════════════════════════════════════

[MultiBed]
bed_overlap = 16,16,16,0,0       ; default output stride: 80-16 = 64 voxels
overlap_in_recon = 0            ; default: non-overlap recon + output stitching
crop_method = sigmoid           ; normalized sigmoid(k=12); direct keeps hard-cut control
seam_postprocess = 1            ; request enable; only runs when multi-bed output overlap>0 + sigmoid
object_profile = auto           ; auto|mouse|phantom|epguan|zimu; explicit override is supported
phantom_close_strength = 1.0    ; contour interpolation blend, range [0,1]
epguan_close_strength = 1.0     ; EP tube/cylinder contour interpolation blend, range [0,1]
epguan_wall_max_preserve = 0    ; 0 avoids bright wall collars; phantom/tube keeps its legacy protection
epguan_seam_edge_strength = 0.60 ; C4 blend at seam-window endpoints, range [0,1]
epguan_seam_feather_slices = 4  ; ramp endpoint blend to full C4 over this many slices
epguan_background_filter = 1    ; attenuate signal outside detected EP tube/cylinder support
epguan_background_retain = 0.08 ; far-background retained fraction, range [0,1]
epguan_support_threshold = 0.06 ; fraction of smoothed P99.5 projection, range (0,1]
epguan_support_margin_mm = 1.5  ; protected margin and feather width outside support
zimu_close_strength = 0.5       ; topology-locked Gaussian blend, sigma=0.3 mm, range [0,1]
seam_half_width = 8             ; capped at overlap/2; zimu is additionally capped at +/-4
fov_radius_mm = 15.0            ; final-output circular XY FOV radius; 0=off
crop_end    = 0,0              ; zero final output Z slices: top,end
z_bed_flip  = 1                ; compact joint: virtual-Z mapping during iteration; non-joint: output per-bed flip
z_out_flip  = 0                ; flip whole output volume after per-bed flip
x_out_flip  = 0                ; flip whole output volume on X
