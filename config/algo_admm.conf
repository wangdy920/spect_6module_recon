; ADMM algorithm configuration (TV proximal Chambolle-Pock + adaptive rho)
; Auto-loaded when -alg admm

[Algorithm]
name       = ADMM
iterations = 50:5
subsets    = 1

[Regularization]
type    = TV
beta    = 0.01
epsilon = 1e-6

[ADMM]
rho            = 1.0          ; augmented Lagrangian penalty rho
tv_inner       = 20           ; Chambolle-Pock inner iterations for TV proximal
adaptive       = true         ; adaptive rho adjustment (Boyd 2011)

[BackendHint]
sparse  = cuda
